server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Container Apps backend
    location /api/ {
        proxy_pass https://plstudio-backend.bluebeach-f4935620.eastus2.azurecontainerapps.io/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host plstudio-backend.bluebeach-f4935620.eastus2.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket telemetry stream
    location /ws/ {
        proxy_pass https://plstudio-backend.bluebeach-f4935620.eastus2.azurecontainerapps.io/ws/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host plstudio-backend.bluebeach-f4935620.eastus2.azurecontainerapps.io;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
